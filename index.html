<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a2b"><title>Fit at 50 · Gym Log</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{color-scheme:dark;--bg:#0c1220;--panel:#151f31;--line:#304058;--ink:#eef4fa;--muted:#adbed4;--accent:#62dfc0;--warn:#ffd18b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}header{padding:18px 16px 12px;max-width:860px;margin:auto}h1{margin:0;font-size:25px;letter-spacing:-.04em}h2{margin:0 0 8px;font-size:19px}h3{margin:0;font-size:16px}p{margin:5px 0}small,.muted{color:var(--muted)}main{max-width:860px;margin:auto;padding:0 12px 90px}.nav{display:flex;gap:7px;overflow:auto;padding:10px 0 15px}.nav button{white-space:nowrap}.daynav{display:flex;gap:5px;overflow:auto;margin:12px 0}.daynav button{white-space:nowrap}button,select,input,textarea{font:inherit}button,.btn{color:var(--ink);background:#24344b;border:1px solid #46607d;border-radius:12px;padding:10px 12px;cursor:pointer;min-height:43px}button.active{background:#166755;border-color:var(--accent)}button.primary{background:#116f58;border-color:#4adab7;font-weight:700}button.ghost{background:transparent}button.danger{color:#ffd2d2;border-color:#9f5763}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}.topline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.pill{font-size:12px;background:#254538;color:#a7f4da;padding:3px 8px;border-radius:30px}.badge{font-size:12px;background:#293a55;padding:4px 8px;border-radius:7px}.field{display:grid;gap:4px}label{font-size:12px;color:var(--muted);font-weight:600}input,select,textarea{min-width:0;width:100%;background:#091321;color:#fff;border:1px solid #4c637e;border-radius:9px;padding:9px;font-size:16px}textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.set{border-top:1px solid var(--line);padding:11px 0}.setgrid{display:grid;grid-template-columns:46px minmax(65px,1fr) minmax(58px,.8fr) minmax(58px,.75fr);gap:8px;align-items:end}.setmeta{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin-top:7px;align-items:end}.setidx{font-size:13px;color:#cbdaf0}.complete{background:#12684f;border-color:#2eca9f}.checkline{display:flex;align-items:center;gap:12px;padding:12px 3px;border-bottom:1px solid var(--line)}.checkline input{width:21px;height:21px;accent-color:#4bdbb4}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#1b2c3c;border-radius:10px;padding:10px;flex:1;min-width:95px}.stat strong{font-size:23px;display:block}.help{font-size:12px;color:var(--muted)}.hidden{display:none!important}.separator{height:1px;background:var(--line);margin:14px 0}.warning{background:#3b3023;border:1px solid #81633b;color:#ffe5be;padding:10px;border-radius:10px}footer{color:var(--muted);text-align:center;font-size:12px;padding:10px}details{margin:10px 0}summary{cursor:pointer;font-weight:650} @media(min-width:680px){.setgrid{grid-template-columns:60px 1fr 1fr 1fr}.setmeta{grid-template-columns:1.3fr 1fr auto}.card{padding:18px}}
</style></head><body><header><div class="topline"><div><small>STRENGTH · PHYSIQUE · RECOMPOSITION</small><h1>Fit at 50 <span style="color:var(--accent)">Gym Log</span></h1></div><span class="pill">PWA · 8 weeks</span></div><p class="muted">Offline gym logging · folder backups for OneDrive sync</p></header><main><nav class="nav" id="tabs"><button data-tab="workout" class="active">Workout</button><button data-tab="recovery">Recovery</button><button data-tab="progress">Progress</button><button data-tab="data">Backup & Export</button></nav><section id="workout"></section><section id="recovery" class="hidden"></section><section id="progress" class="hidden"></section><section id="data" class="hidden"></section></main><footer>All weights in lb unless changed in your notes. Keep equipment conventions consistent. Folder backups sync through FolderSync; not two-way app sync.</footer>
<script>
const PROGRAM = {"Monday": [["Mon-01", "Rope triceps pressdown \u2014 warm-up", 2, "15\u201320", "warmup", "Light only; before pressing", ""], ["Mon-02", "Flat barbell bench press", 3, "Top 4\u20136; back-off 6\u20138", "working", "45 lb bar included; warm up separately, target 1\u20132 RIR", ""], ["Mon-03", "Incline dumbbell press", 2, "8\u201312", "working", "90 lb each hand reference; Hammer incline if busy", "Incline dumbbell press|Hammer Strength incline press|Smith incline press"], ["Mon-04", "Low-to-high cable fly", 2, "12\u201315", "working", "Pair with lateral raises if convenient", ""], ["Mon-05", "Dumbbell lateral raise", 3, "12\u201320", "working", "Controlled; pair first two sets with cable fly", "Dumbbell lateral raise|Lateral raise machine"], ["Mon-06", "Overhead rope triceps extension", 2, "10\u201315", "working", "Pair with calves", ""], ["Mon-07", "Hoist CF-3355 leg-press calf raise", 3, "10\u201315", "working", "Straight-knee, full controlled ROM; no shoulder-loaded machine", ""], ["Mon-08", "Rope triceps pressdown \u2014 working", 2, "10\u201315", "optional", "Optional; cut if session exceeds 75 min", ""], ["Mon-09", "Cable fly / pec-deck chest pump", 1, "15\u201320", "optional", "Optional ONE set; pick available equipment; omit if short on time", "Cable fly|Pec deck"], ["Mon-10", "Reverse pec-deck rear-delt fly \u2014 cooldown", 3, "12\u201315", "working", "Last exercise; moderate resistance, 2\u20133 RIR", ""]], "Tuesday": [["Tue-01", "Neutral-grip lat pulldown", 3, "8\u201312", "working", "Back width; 1\u20133 RIR", ""], ["Tue-02", "Seated neutral-grip cable row", 3, "8\u201312", "working", "Mid-back; keep torso stable", ""], ["Tue-03", "Reverse pec deck", 3, "12\u201320", "working", "Pair with incline cable curls", ""], ["Tue-04", "Incline cable curl", 3, "8\u201312", "working", "Preferred shoulder-friendly curl", ""], ["Tue-05", "Rope straight-arm pulldown", 2, "12\u201315", "working", "Pair with hammer curls", ""], ["Tue-06", "Hammer curl", 2, "10\u201315", "working", "Brachioradialis and arms", ""], ["Tue-07", "Reverse EZ-bar curl", 2, "12\u201315", "optional", "Forearm accessory; optional when pressed for time", ""]], "Thursday": [["Thu-01", "Leg press", 3, "8\u201312", "working", "Quads maintenance, not hypertrophy priority", ""], ["Thu-02", "Leg extension", 2, "10\u201315", "working", "Pair with seated leg curl", ""], ["Thu-03", "Seated leg curl", 3, "8\u201312", "working", "Hamstrings", ""], ["Thu-04", "Lying leg curl", 1, "12\u201315", "optional", "Optional extra hamstring set", ""], ["Thu-06", "Standing calf raise \u2014 RETIRED historical entry", 0, "10\u201315", "optional", "Historical Week 1 entry only. No standing calf raises prescribed on Thursday.", ""], ["Thu-07", "Seated calf raise", 3, "12\u201320", "working", "Soleus emphasis; 1\u20132 RIR", ""], ["Thu-08", "Weighted kneeling cable crunch", 2, "10\u201315", "working", "Controlled, gradually progress loading; pause for scar-site symptoms", ""], ["Thu-09", "Adjustable incline ab trainer", 2, "12\u201315", "working", "Shallow incline, controlled range", ""]], "Friday": [["Fri-01", "Hammer Strength iso-lateral incline chest press", 3, "8\u201312", "working", "Track plates per side or total consistently; 1\u20132 RIR", ""], ["Fri-02", "High-to-low cable fly", 3, "12\u201315", "working", "Chest contour; pair with rows", ""], ["Fri-03", "Seated neutral-grip cable row", 2, "10\u201312", "working", "Replacement for unavailable chest-supported row", ""], ["Fri-04", "Dumbbell lateral raise", 3, "12\u201320", "working", "Machine alternative allowed", "Dumbbell lateral raise|Lateral raise machine"], ["Fri-05", "Preacher curl", 2, "10\u201315", "working", "Supported cable curl alternative", "Preacher curl|Supported cable curl"], ["Fri-06", "Single-arm cable triceps pressdown", 3, "10\u201315", "working", "Keep elbow controlled", ""], ["Fri-07", "Hoist CF-3355 leg-press calf raise", 3, "8\u201312", "working", "Straight-knee, no bodyweight finisher", ""], ["Fri-08", "Machine lateral raise finisher", 0, "12\u201320", "optional", "Optional extra if time and recovery permit", ""]]};
const RECOVERY = ["20\u201325 min conversational treadmill walk", "90/90 hip switches \u2014 2 \u00d7 6/side", "Half-kneeling hip flexor \u2014 2 \u00d7 30 sec/side", "Adductor rock-backs \u2014 1 \u00d7 10/side", "Supine figure-four \u2014 30\u201345 sec/side", "Supported hamstring stretch \u2014 30 sec/side", "Dry sauna 8\u201315 min OR steam room 5\u201310 min", "Cool down and hydrate"];
const SEED = {"entries":{},"session":{},"dates":{},"recovery":{},"unit":"lb","week":1,"day":"Monday"};

const KEY='fitat50_gym_v2';
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const defaultState=()=>({entries:{},session:{},dates:{},recovery:{},unit:'lb',week:1,day:'Monday',types:{},variants:{},extras:{},activity:{},metrics:{},skipped:{}});
let state;
try{const saved=localStorage.getItem(KEY);state=saved?Object.assign(defaultState(),JSON.parse(saved)):Object.assign(defaultState(),structuredClone(SEED));}catch(e){state=Object.assign(defaultState(),JSON.parse(JSON.stringify(SEED)))}
for(const k of ['entries','session','dates','recovery','types','variants','extras','activity','metrics','skipped']) state[k]??={};
let tab='workout';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=()=>`${state.week}|${state.day}`;
const eKey=(id,n)=>`${state.week}|${state.day}|${id}|${n}`;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state)); folderChanged()}catch(e){alert('Browser storage is unavailable. Use Export Backup to save your entries.')}};
const listen=(container=document)=>{container.querySelectorAll('[data-action]').forEach(el=>{el.addEventListener(el.tagName==='BUTTON'?'click':'change',e=>act(el,e))})};
const spec=(d)=>PROGRAM[d]||[];
function getRows(d){return spec(d).flatMap(x=>{let [id,name,n]=x;let extra=Number(state.extras[`${state.week}|${d}|${id}`]||0);let legacy=Object.keys(state.entries).filter(k=>k.startsWith(`${state.week}|${d}|${id}|`)).map(k=>Number(k.split('|')[3]));let max=Math.max(n+extra,...legacy,0);return Array.from({length:max},(_,i)=>({id,n:i+1,exercise:x}));});}
function show(tabname){tab=tabname;for(const el of document.querySelectorAll('main>section'))el.classList.toggle('hidden',el.id!==tab);for(const el of document.querySelectorAll('#tabs button'))el.classList.toggle('active',el.dataset.tab===tab);render()}
function render(){if(tab==='workout')workout();if(tab==='recovery')recovery();if(tab==='progress')progress();if(tab==='data')dataPanel()}
function header(dayList=true){return `<div class="card"><div class="row"><div class="field"><label>Training week</label><select data-action="week">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${state.week===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></div><div class="field"><label>Session date</label><input type="date" data-action="date" value="${esc(state.dates[dayKey()]||'')}"></div></div>${dayList?`<div class="daynav">${DAYS.slice(0,5).map(d=>`<button data-action="day" data-value="${d}" class="${state.day===d?'active':''}">${d.slice(0,3)}</button>`).join('')}</div>`:''}</div>`}
function workout(){const d=state.day,exs=spec(d);let html=header();if(d==='Wednesday')html+=`<div class="card">Wednesday is a recovery visit. <button data-action="gotoRecovery">Open mobility & sauna</button></div>`;
else {let done=getRows(d).filter(({id,n})=>state.entries[eKey(id,n)]?.done).length;html+=`<div class="card"><div class="topline"><h2>${d} · ${d==='Monday'?'Press strength & upper chest':d==='Tuesday'?'Back & arms':d==='Thursday'?'Leg maintenance, calves & abs':'Upper-body hypertrophy'}</h2><span class="pill">${done} sets completed</span></div><p class="help">Target 60–75 minutes. Keep heavy compound lifts rested; superset accessories only when practical. Optional exercises may be skipped.</p><label class="checkline"><input type="checkbox" data-action="skip" ${state.skipped[dayKey()]?'checked':''}> Mark session missed (schedule conflict)</label></div>`;
for(const [id,name,num,range,type,hint,variants] of exs){const vkey=`${state.week}|${d}|${id}`;let activeName=state.variants[vkey]||name;let rows=getRows(d).filter(r=>r.id===id);if(num===0 && rows.length===0)continue;
html+=`<article class="card"><div class="topline"><h3>${esc(name)}</h3><span class="badge">${num} prescribed · ${esc(range)}</span></div><p class="help">${esc(hint)}</p>`;
if(variants)html+=`<div class="field" style="margin:10px 0"><label>Equipment / substitution (logged separately)</label><select data-action="variant" data-id="${id}">${variants.split('|').map(v=>`<option ${activeName===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;
html+=`<div class="help">Set weight convention: barbell = total incl bar · DB = each hand · Hammer/Hoist = use one consistent convention</div>`;
for(const r of rows){let k=eKey(id,r.n),entry=state.entries[k]||{},t=state.types[k]||type;html+=`<div class="set"><div class="setgrid"><div class="setidx">Set ${r.n}</div><div class="field"><label>Weight</label><input inputmode="decimal" type="number" min="0" step="any" data-action="set" data-id="${id}" data-n="${r.n}" data-field="weight" value="${esc(entry.weight??'')}"></div><div class="field"><label>Reps</label><input inputmode="numeric" type="number" min="0" data-action="set" data-id="${id}" data-n="${r.n}" data-field="reps" value="${esc(entry.reps??'')}"></div><div class="field"><label>RIR</label><input inputmode="numeric" type="number" min="0" max="10" data-action="set" data-id="${id}" data-n="${r.n}" data-field="rir" value="${esc(entry.rir??'')}"></div></div><div class="setmeta"><div class="field"><label>Set type</label><select data-action="settype" data-id="${id}" data-n="${r.n}">${['warmup','working','backoff','optional'].map(a=>`<option value="${a}" ${a===t?'selected':''}>${a==='warmup'?'Warm-up':a==='backoff'?'Back-off':a==='working'?'Working':'Optional / extra'}</option>`).join('')}</select></div><div class="field"><label>Actual exercise</label><small>${esc(activeName)}</small></div><button data-action="done" data-id="${id}" data-n="${r.n}" class="${entry.done?'complete':''}">${entry.done?'✓ Done':'Mark done'}</button></div></div>`}
html+=`<div class="toolbar"><button class="ghost" data-action="addset" data-id="${id}">+ Add set</button>${Number(state.extras[vkey]||0)>0?`<button class="ghost" data-action="removeset" data-id="${id}">− Remove extra</button>`:''}</div></article>`}
html+=`<div class="card"><h3>Session details</h3><div class="row"><div class="field"><label>Duration (minutes)</label><input type="number" min="0" data-action="sessionfield" data-field="minutes" value="${esc(state.session[dayKey()]?.minutes??'')}"></div><div class="field"><label>Cardio (minutes)</label><input type="number" min="0" data-action="sessionfield" data-field="cardio" value="${esc(state.session[dayKey()]?.cardio??'')}"></div></div><div class="field" style="margin-top:8px"><label>Notes / scar-area symptoms / machine settings</label><textarea data-action="sessionfield" data-field="note">${esc(state.session[dayKey()]?.note??'')}</textarea></div></div>`}
document.getElementById('workout').innerHTML=html;listen(document.getElementById('workout'))}
function recovery(){const k=`${state.week}|Wednesday`;let checks=state.recovery[k]||{};let html=`<div class="card"><h2>Wednesday · Recovery & sauna</h2><p class="muted">Easy activity only. No required lifting. Dry sauna OR steam room, not both. Stop for dizziness or unusual symptoms.</p><div class="field"><label>Session date</label><input type="date" data-action="recoverydate" value="${esc(state.dates[k]||'')}"></div>`;RECOVERY.forEach((r,i)=>html+=`<label class="checkline"><input type="checkbox" data-action="recoverycheck" data-idx="${i}" ${checks[i]?'checked':''}><span>${esc(r)}</span></label>`);let s=state.session[k]||{};html+=`<div class="row" style="margin-top:12px"><div class="field"><label>Walking minutes</label><input type="number" min="0" data-action="recoveryfield" data-field="cardio" value="${esc(s.cardio??'')}"></div><div class="field"><label>Total session minutes</label><input type="number" min="0" data-action="recoveryfield" data-field="minutes" value="${esc(s.minutes??'')}"></div></div><div class="field"><label>Notes</label><textarea data-action="recoveryfield" data-field="note">${esc(s.note??'')}</textarea></div></div>`;document.getElementById('recovery').innerHTML=html;listen(document.getElementById('recovery'))}
function progress(){let total=Object.values(state.entries).filter(x=>x.done).length;let current=Object.keys(state.entries).filter(x=>x.startsWith(`${state.week}|`)&&state.entries[x].done).length;let html=`<div class="card"><h2>Training overview</h2><div class="toolbar"><div class="stat"><strong>${total}</strong><small>Completed sets, all weeks</small></div><div class="stat"><strong>${current}</strong><small>Sets this week</small></div><div class="stat"><strong>${Object.keys(state.dates).length}</strong><small>Sessions dated</small></div></div><p class="help">Old backup imported as recorded, including ramp-up/pyramid sets. Classify historical sets before interpreting working-set volume.</p></div>`;
html+=`<div class="card"><h2>Weekly check-in</h2><div class="field"><label>Week to edit</label><select data-action="week">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${state.week===i+1?'selected':''}>Week ${i+1}</option>`).join('')}</select></div>`;let m=state.metrics[state.week]||{};for(let i=0;i<6;i+=2){let f=[['weight','Average bodyweight (lb)'],['waist','Waist (in)'],['chest','Chest (in)'],['calfL','Left calf (in)'],['calfR','Right calf (in)'],['steps','Avg daily steps']];html+=`<div class="row" style="margin-top:9px">${f.slice(i,i+2).map(([key,label])=>`<div class="field"><label>${label}</label><input type="number" step="any" data-action="metric" data-field="${key}" value="${esc(m[key]??'')}"></div>`).join('')}</div>`}html+='</div>';
html+=`<div class="card"><h2>Daily activity · Week ${state.week}</h2><p class="muted">Target ~7,000 average daily steps; Saturday brisk walk 30–40 min. Only cardio of moderate intensity counts toward aerobic target.</p>`;for(let d of DAYS){let key=`${state.week}|${d}`,a=state.activity[key]||{};html+=`<div class="row" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><strong>${d}</strong></div><div class="row"><div class="field"><label>Steps</label><input type="number" data-action="activity" data-day="${d}" data-field="steps" value="${esc(a.steps??'')}"></div><div class="field"><label>Cardio min</label><input type="number" data-action="activity" data-day="${d}" data-field="cardio" value="${esc(a.cardio??'')}"></div></div></div>`}html+='</div>';document.getElementById('progress').innerHTML=html;listen(document.getElementById('progress'))}
function dataPanel(){document.getElementById('data').innerHTML=`${folderPanelHtml()}<div class="card"><h2>Protect your training history</h2><p>Entries save automatically in this browser on this device. Local file and private browsing storage can be cleared. Export a backup after each week.</p><div class="toolbar"><button class="primary" data-action="exportjson">Download full JSON backup</button><button data-action="exportcsv">Export sets CSV</button></div><div class="separator"></div><h3>Restore / merge a backup</h3><p class="help">Supports your original Fit at 50 Gym Log v1 backups and this v2 format. Matching set keys are replaced by imported values; other entries are preserved.</p><input type="file" id="importfile" accept=".json,application/json"><button data-action="import">Import selected backup</button><div class="separator"></div><details><summary>Reset this device (danger)</summary><p>Export a backup first. Reset erases the stored training log in this browser.</p><button class="danger" data-action="reset">Erase local log</button></details></div><div class="warning">The hosted files contain no personal workout history. Import your existing JSON backup privately. One-way backup files can be uploaded to OneDrive with FolderSync; this does not restore or merge logs automatically on another device.</div>`;listen(document.getElementById('data'))}
function updateEntry(id,n,field,value){let k=eKey(id,n),e=state.entries[k]||{};if(value==='')delete e[field];else e[field]=field==='done'?value:Number(value);state.entries[k]=e;save()}
function act(el,e){let a=el.dataset.action,id=el.dataset.id,n=Number(el.dataset.n);if(a.startsWith('folder')){handleFolder(a,el);return}if(a==='week'){state.week=Number(el.value);save();render();return}if(a==='day'){state.day=el.dataset.value;save();render();return}if(a==='gotoRecovery'){show('recovery');return}if(a==='date'||a==='recoverydate'){state.dates[a==='date'?dayKey():`${state.week}|Wednesday`]=el.value;save();return}
if(a==='set'){updateEntry(id,n,el.dataset.field,el.value);return}if(a==='done'){let k=eKey(id,n);updateEntry(id,n,'done',!(state.entries[k]?.done));workout();return}if(a==='settype'){state.types[eKey(id,n)]=el.value;save();return}if(a==='variant'){state.variants[`${state.week}|${state.day}|${id}`]=el.value;save();workout();return}if(a==='addset'||a==='removeset'){let k=`${state.week}|${state.day}|${id}`;state.extras[k]=Math.max(0,Number(state.extras[k]||0)+(a==='addset'?1:-1));save();workout();return}if(a==='skip'){state.skipped[dayKey()]=el.checked;save();return}if(a==='sessionfield'||a==='recoveryfield'){let k=a==='recoveryfield'?`${state.week}|Wednesday`:dayKey();state.session[k]??={};state.session[k][el.dataset.field]=el.value;save();return}if(a==='recoverycheck'){let k=`${state.week}|Wednesday`;state.recovery[k]??={};state.recovery[k][el.dataset.idx]=el.checked;save();return}if(a==='recoverydate'){state.dates[`${state.week}|Wednesday`]=el.value;save();return}if(a==='metric'){state.metrics[state.week]??={};state.metrics[state.week][el.dataset.field]=el.value;save();return}if(a==='activity'){let k=`${state.week}|${el.dataset.day}`;state.activity[k]??={};state.activity[k][el.dataset.field]=el.value;save();return}if(a==='exportjson'){download('Fit_at_50_Gym_Log_Backup_v2.json',JSON.stringify({app:'Fit at 50 Gym Log',version:2,savedAt:new Date().toISOString(),data:state},null,2),'application/json');return}if(a==='exportcsv'){exportCSV();return}if(a==='import'){importFile();return}if(a==='reset'){if(confirm('Erase all locally stored gym log data? Export a backup first.')){state=defaultState();save();show('workout')}return}}
function download(name,data,mime){const b=new Blob([data],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCSV(){let rows=[['week','day','date','exercise_id','exercise','set','set_type','weight_lb','reps','RIR','done','substitution']];for(const [key,en] of Object.entries(state.entries)){let [w,d,id,n]=key.split('|'),item=(PROGRAM[d]||[]).find(x=>x[0]===id),sub=state.variants[`${w}|${d}|${id}`]||'';rows.push([w,d,state.dates[`${w}|${d}`]||'',id,item?.[1]||id,n,state.types[key]||item?.[4]||'unclassified',en.weight??'',en.reps??'',en.rir??'',en.done?'yes':'no',sub])}let csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('Fit_at_50_Gym_Sets.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
async function importFile(){const file=document.getElementById('importfile').files[0];if(!file){alert('Choose a JSON backup first.');return}try{let obj=JSON.parse(await file.text());if(obj.app!=='Fit at 50 Gym Log'||!obj.data?.entries)throw Error('Not a supported Fit at 50 backup');const old=obj.data;for(const k of ['entries','session','dates','recovery','types','variants','extras','activity','metrics','skipped'])Object.assign(state[k],old[k]||{});state.week=old.week||state.week;state.day=old.day||state.day;save();alert(`Backup imported. ${Object.keys(old.entries).length} set records read. Existing other records preserved.`);show('workout')}catch(e){alert('Import failed: '+e.message)}}
for(const el of document.querySelectorAll('#tabs button'))el.addEventListener('click',()=>show(el.dataset.tab));show('workout');

// Local-first, user-authorized Android directory backup. FolderSync uploads saved files to OneDrive.
const FOLDER_CFG='fitat50_folder_config_v1';
const FOLDER_DB='fitat50_folder_handles_v1';
const folderConfig=(()=>{let c={};try{c=JSON.parse(localStorage.getItem(FOLDER_CFG)||'{}')}catch(e){};c.deviceId??=(crypto.randomUUID?.()||String(Date.now())).replace(/-/g,'').slice(0,12);c.auto??=true;return c})();
const saveFolderConfig=()=>{try{localStorage.setItem(FOLDER_CFG,JSON.stringify(folderConfig))}catch(e){}};
saveFolderConfig();
let folderHandle=null,folderBusy=false,folderTimer=null,folderStatus='No backup folder selected';
function folderFilename(){return `Fit_at_50_${folderConfig.deviceId}_latest.json`}
function folderPayload(){return JSON.stringify({app:'Fit at 50 Gym Log',version:3,savedAt:new Date().toISOString(),deviceId:folderConfig.deviceId,data:state},null,2)}
function folderPanelHtml(){const last=folderConfig.lastBackup?new Date(folderConfig.lastBackup).toLocaleString():'Never';return `<div class="card"><h2>📁 Automatic folder backups</h2><p class="help">Save JSON files into a folder you choose on your phone. FolderSync can then upload that folder into personal OneDrive. No Microsoft developer registration required.</p><p class="pill" id="folderstatus">${esc(folderStatus)}</p><p class="help">Selected folder: <strong>${esc(folderConfig.folderName||'Not selected')}</strong> · Last successful local file write: <strong>${esc(last)}</strong></p><div class="toolbar"><button class="primary" data-action="folderpick">Choose backup folder</button><button data-action="foldertest">Write test backup now</button><button data-action="folderreconnect">Reauthorize folder</button></div><label class="checkline"><input type="checkbox" data-action="folderauto" ${folderConfig.auto?'checked':''}>Automatically update backup after changes (while app is open)</label><p class="help">Latest file: <strong>${esc(folderFilename())}</strong>. One dated snapshot is written per local day after changes. This badge confirms a LOCAL file write only; use FolderSync and OneDrive to verify cloud delivery.</p><div class="warning">Android may request renewed folder access after reopening the app. If backup says permission needed, tap Reauthorize folder. Backups do not run while the PWA is closed; sync by FolderSync is separate.</div></div>`}
function folderShow(s){folderStatus=s;const n=document.getElementById('folderstatus');if(n)n.textContent=s}
function openHandleDb(){return new Promise((resolve,reject)=>{let req=indexedDB.open(FOLDER_DB,1);req.onupgradeneeded=()=>req.result.createObjectStore('handles');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function rememberHandle(handle){let db=await openHandleDb();try{await new Promise((resolve,reject)=>{let tx=db.transaction('handles','readwrite');tx.objectStore('handles').put(handle,'backup');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}finally{db.close()}}
async function recallHandle(){let db=await openHandleDb();try{return await new Promise((resolve,reject)=>{let tx=db.transaction('handles','readonly');let req=tx.objectStore('handles').get('backup');req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}finally{db.close()}}
async function permissionGranted(h,request=false){if(!h)return false;try{const opts={mode:'readwrite'};if((await h.queryPermission(opts))==='granted')return true;if(request && typeof h.requestPermission==='function')return(await h.requestPermission(opts))==='granted'}catch(e){}return false}
async function pickFolder(){if(typeof window.showDirectoryPicker!=='function'){folderShow('Folder picker unavailable in this browser. Use JSON export instead.');return}try{const h=await window.showDirectoryPicker({mode:'readwrite',id:'fit50-backup'});folderHandle=h;folderConfig.folderName=h.name;await rememberHandle(h);saveFolderConfig();folderShow('Folder chosen — verifying write access');await writeFolderBackup(true)}catch(e){folderShow(e.name==='AbortError'?'Folder selection cancelled':'Folder selection failed: '+e.message)}}
async function writeFolderBackup(interactive=false){if(folderBusy)return;if(!folderHandle){folderShow('Choose backup folder first');return}if(!await permissionGranted(folderHandle,interactive)){folderShow('Permission needed — tap Reauthorize folder');return}folderBusy=true;folderShow('Writing local backup…');const marker=JSON.stringify(state);try{const body=folderPayload();let f=await folderHandle.getFileHandle(folderFilename(),{create:true});let w=await f.createWritable();try{await w.write(body);await w.close()}catch(e){await w.abort().catch(()=>{});throw e}
 const date=[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-'); // per-day recovery copy
 if(folderConfig.lastSnapshot!==date){let sf=await folderHandle.getFileHandle(`Fit_at_50_${folderConfig.deviceId}_${date}.json`,{create:true});let sw=await sf.createWritable();try{await sw.write(body);await sw.close()}catch(e){await sw.abort().catch(()=>{});throw e}folderConfig.lastSnapshot=date}
 folderConfig.lastBackup=new Date().toISOString();folderConfig.dirty=JSON.stringify(state)!==marker;saveFolderConfig();folderShow('Local backup saved at '+new Date(folderConfig.lastBackup).toLocaleTimeString()+' — check FolderSync for cloud status');
 }catch(e){folderConfig.dirty=true;saveFolderConfig();folderShow('Local backup failed: '+e.message)}finally{folderBusy=false;if(folderConfig.dirty&&folderConfig.auto&&folderHandle){clearTimeout(folderTimer);folderTimer=setTimeout(()=>writeFolderBackup(false),20000)}}}
function folderChanged(){folderConfig.dirty=true;saveFolderConfig();if(folderConfig.auto&&folderHandle){clearTimeout(folderTimer);folderTimer=setTimeout(()=>writeFolderBackup(false),12000)}}
async function handleFolder(a,el){if(a==='folderpick'){await pickFolder();return}if(a==='foldertest'){await writeFolderBackup(true);return}if(a==='folderreconnect'){if(!folderHandle){await pickFolder();return}if(await permissionGranted(folderHandle,true)){folderShow('Folder access granted');await writeFolderBackup(true)}else folderShow('Permission not granted; choose folder again');return}if(a==='folderauto'){folderConfig.auto=el.checked;saveFolderConfig();if(folderConfig.auto&&folderConfig.dirty)writeFolderBackup(false)}}
(async()=>{try{folderHandle=await recallHandle();if(folderHandle){folderConfig.folderName=folderHandle.name;saveFolderConfig();if(await permissionGranted(folderHandle,false)){folderShow('Folder ready · last local backup: '+(folderConfig.lastBackup?new Date(folderConfig.lastBackup).toLocaleString():'never'));if(folderConfig.dirty&&folderConfig.auto)writeFolderBackup(false)}else folderShow('Folder remembered, but access needs reauthorization')}}catch(e){folderShow('Folder access unavailable: '+e.message)}})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&folderHandle&&folderConfig.auto&&folderConfig.dirty)writeFolderBackup(false)});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
